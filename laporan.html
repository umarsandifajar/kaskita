<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Laporan Kas Kelas 3 At-Taubah</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }

        /* Print Optimization */
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: white !important;
                color: black !important;
                padding: 0 !important;
            }
            .phone-frame {
                max-width: 100% !important;
                border: none !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
            }
            .shadow-sm, .shadow, .shadow-lg, .shadow-2xl {
                box-shadow: none !important;
            }
            table {
                border-collapse: collapse !important;
                width: 100% !important;
            }
            th, td {
                border: 1px solid #cbd5e1 !important;
            }
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-800 antialiased min-h-screen flex justify-center items-start sm:py-6 p-0 selection:bg-blue-600 selection:text-white">

    <!-- ================= PHONE CONTAINER ================= -->
    <div class="phone-frame w-full sm:max-w-[430px] min-h-screen bg-slate-50 flex flex-col sm:rounded-[36px] sm:shadow-[0_25px_60px_-15px_rgba(0,0,0,0.6)] sm:border-[6px] sm:border-slate-800/90 relative overflow-x-hidden pb-24">

        <!-- Phone Top Notch Decoration (Desktop only) -->
        <div class="no-print hidden sm:flex justify-center pt-2.5 pb-1 bg-slate-50 sticky top-0 z-50">
            <div class="w-24 h-4 bg-slate-900 rounded-full flex items-center justify-center">
                <div class="w-2.5 h-2.5 rounded-full bg-slate-800 border border-slate-700"></div>
            </div>
        </div>

        <!-- ================= TOP HEADER ================= -->
        <header class="px-5 pt-4 pb-3 bg-white/80 backdrop-blur-md sticky top-0 sm:top-6 z-40 border-b border-slate-100 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="no-print w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 active:scale-95 flex items-center justify-center text-slate-700 text-sm font-bold transition">
                    ←
                </a>
                <div>
                    <h1 class="text-base font-extrabold tracking-tight text-slate-900">Laporan Kas</h1>
                    <p class="text-[11px] font-semibold text-slate-500">
                        Dicetak: <span id="tanggalCetak" class="text-slate-700 font-bold">-</span>
                    </p>
                </div>
            </div>

            <!-- Print / PDF Button -->
            <button
                onclick="window.print()"
                class="no-print inline-flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white text-xs font-bold px-3 py-2 rounded-xl shadow-sm transition">
                🖨 <span>Cetak</span>
            </button>
        </header>

        <!-- ================= MAIN CONTENT ================= -->
        <main class="px-4 sm:px-5 pt-4 space-y-4">

            <!-- ================= SUMMARY CARDS ================= -->
            <div class="bg-white rounded-3xl p-5 border border-slate-100 shadow-sm">
                <div class="flex items-center gap-2 mb-3">
                    <span class="text-base">📊</span>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-900">
                        Ringkasan Keuangan
                    </h2>
                </div>

                <!-- Saldo Utama -->
                <div class="p-4 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white mb-3 shadow-md shadow-blue-500/20">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-blue-100">Sisa Saldo Kas</span>
                    <div id="saldo" class="text-2xl sm:text-3xl font-extrabold mt-0.5">
                        Rp0
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <!-- Total Masuk -->
                    <div class="p-3 rounded-2xl bg-emerald-50 border border-emerald-100">
                        <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-800">Total Masuk</span>
                        <div id="totalMasuk" class="text-sm sm:text-base font-bold text-emerald-600 mt-0.5 truncate">
                            Rp0
                        </div>
                    </div>

                    <!-- Total Keluar -->
                    <div class="p-3 rounded-2xl bg-rose-50 border border-rose-100">
                        <span class="text-[10px] font-bold uppercase tracking-wider text-rose-800">Total Keluar</span>
                        <div id="totalKeluar" class="text-sm sm:text-base font-bold text-rose-600 mt-0.5 truncate">
                            Rp0
                        </div>
                    </div>
                </div>
            </div>

            <!-- ================= DETAIL PEMASUKAN ================= -->
            <div class="bg-white rounded-3xl p-4 sm:p-5 border border-slate-100 shadow-sm">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2">
                        <span class="w-6 h-6 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-xs">↓</span>
                        <h2 class="text-xs sm:text-sm font-bold text-slate-900 uppercase tracking-wider">
                            Detail Pemasukan
                        </h2>
                    </div>
                    <span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">
                        Kas Masuk
                    </span>
                </div>

                <div class="overflow-x-auto -mx-1">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead>
                            <tr class="border-b border-slate-200 bg-slate-50/80 text-slate-600 font-bold">
                                <th class="p-2 text-center rounded-l-lg">No</th>
                                <th class="p-2">Tgl</th>
                                <th class="p-2">Nama</th>
                                <th class="p-2">Ket</th>
                                <th class="p-2 text-right rounded-r-lg">Nominal</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyPemasukan" class="divide-y divide-slate-100 text-slate-700">
                            <tr>
                                <td colspan="5" class="p-4 text-center text-slate-400">
                                    Memuat data pemasukan...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- ================= DETAIL PENGELUARAN ================= -->
            <div class="bg-white rounded-3xl p-4 sm:p-5 border border-slate-100 shadow-sm">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2">
                        <span class="w-6 h-6 rounded-lg bg-rose-100 text-rose-700 flex items-center justify-center font-bold text-xs">↑</span>
                        <h2 class="text-xs sm:text-sm font-bold text-slate-900 uppercase tracking-wider">
                            Detail Pengeluaran
                        </h2>
                    </div>
                    <span class="text-[10px] font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-full">
                        Kas Keluar
                    </span>
                </div>

                <div class="overflow-x-auto -mx-1">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead>
                            <tr class="border-b border-slate-200 bg-slate-50/80 text-slate-600 font-bold">
                                <th class="p-2 text-center rounded-l-lg">No</th>
                                <th class="p-2">Tgl</th>
                                <th class="p-2">Keperluan</th>
                                <th class="p-2 text-right rounded-r-lg">Nominal</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyPengeluaran" class="divide-y divide-slate-100 text-slate-700">
                            <tr>
                                <td colspan="4" class="p-4 text-center text-slate-400">
                                    Memuat data pengeluaran...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>

        <!-- ================= STICKY BOTTOM NAVIGATION ================= -->
        <nav class="no-print fixed sm:absolute bottom-0 left-0 right-0 max-w-full sm:max-w-[430px] mx-auto bg-white/90 backdrop-blur-lg border-t border-slate-200/80 px-6 py-2.5 z-50 flex items-center justify-around sm:rounded-b-[30px]">
            <!-- Beranda -->
            <a href="index.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-700 transition-all">
                <span class="text-lg">🏠</span>
                <span class="text-[10px] font-semibold">Beranda</span>
            </a>

            <!-- Laporan (Active) -->
            <a href="laporan.html" class="flex flex-col items-center gap-1 text-blue-600 transition-all">
                <span class="text-lg">📄</span>
                <span class="text-[10px] font-bold">Laporan</span>
            </a>

            <!-- Admin -->
            <a href="admin.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-700 transition-all">
                <span class="text-lg">🔒</span>
                <span class="text-[10px] font-semibold">Admin</span>
            </a>
        </nav>

    </div>

    <!-- Script Technical Logic -->
    <script src="js/laporan.js"></script>

</body>
</html>
