<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KasKita Admin - Kelola Kas Kelas</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-800 antialiased min-h-screen flex justify-center items-start sm:py-6 p-0 selection:bg-purple-600 selection:text-white">

    <!-- ================= PHONE CONTAINER ================= -->
    <div class="w-full sm:max-w-[430px] min-h-screen bg-slate-50 flex flex-col sm:rounded-[36px] sm:shadow-[0_25px_60px_-15px_rgba(0,0,0,0.6)] sm:border-[6px] sm:border-slate-800/90 relative overflow-x-hidden pb-24">

        <!-- Phone Top Notch Decoration (Desktop only) -->
        <div class="hidden sm:flex justify-center pt-2.5 pb-1 bg-slate-50 sticky top-0 z-50">
            <div class="w-24 h-4 bg-slate-900 rounded-full flex items-center justify-center">
                <div class="w-2.5 h-2.5 rounded-full bg-slate-800 border border-slate-700"></div>
            </div>
        </div>

        <!-- ================= TOP HEADER ================= -->
        <header class="px-5 pt-4 pb-3 bg-white/80 backdrop-blur-md sticky top-0 sm:top-6 z-40 border-b border-slate-100 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-600 flex items-center justify-center text-white text-xl shadow-md shadow-purple-500/20">
                    🔒
                </div>
                <div>
                    <h1 class="text-lg font-extrabold tracking-tight text-slate-900">KasKita Admin</h1>
                    <p class="text-xs font-semibold text-slate-500">
                        Panel Bendahara Kelas
                    </p>
                </div>
            </div>

            <!-- WA Bendahara Button -->
            <a id="waBtn" href="#" target="_blank" class="hidden inline-flex items-center gap-1.5 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white text-xs font-bold px-3.5 py-2 rounded-full shadow-sm shadow-emerald-500/30 transition-all">
                <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
                <span>WhatsApp</span>
            </a>
        </header>

        <!-- ================= MAIN CONTENT ================= -->
        <main class="px-5 pt-4 space-y-4">

            <!-- ================= LOGIN CARD ================= -->
            <div id="loginCard" class="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm text-center">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-purple-50 text-purple-600 flex items-center justify-center text-2xl mb-3 shadow-inner">
                    🔐
                </div>
                <h2 class="text-base font-bold text-slate-900">Autentikasi Admin</h2>
                <p class="text-xs text-slate-500 mt-1 mb-5">
                    Masukkan PIN Bendahara untuk mengelola kas
                </p>

                <div class="text-left mb-4">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                        PIN Admin
                    </label>
                    <input
                        id="pin"
                        type="password"
                        placeholder="••••••"
                        class="w-full text-center tracking-[0.5em] text-xl font-bold bg-slate-50 border border-slate-200 focus:border-purple-500 focus:bg-white focus:ring-2 focus:ring-purple-200 outline-none p-3.5 rounded-2xl transition">
                </div>

                <button
                    onclick="login()"
                    class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 active:scale-95 text-white font-bold py-3.5 px-4 rounded-2xl shadow-md shadow-purple-500/25 transition">
                    Masuk ke Panel
                </button>

                <p id="msg" class="text-xs font-semibold text-rose-600 mt-3 min-h-[16px]"></p>
            </div>

            <!-- ================= ADMIN DASHBOARD (APP) ================= -->
            <div id="app" class="hidden space-y-4">

                <!-- Saldo Card -->
                <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-purple-600 via-indigo-600 to-blue-600 p-6 text-white shadow-lg shadow-purple-600/25">
                    <div class="flex items-center justify-between text-xs text-purple-100">
                        <span class="uppercase tracking-wider font-semibold">Total Saldo Terkini</span>
                        <span class="bg-white/20 px-2 py-0.5 rounded-full text-[10px] font-bold">Sinkron</span>
                    </div>
                    <div id="saldo" class="text-3xl sm:text-4xl font-extrabold tracking-tight mt-2 text-white">
                        Rp0
                    </div>
                </div>

                <!-- Reminder / Pengumuman -->
                <div class="bg-white rounded-3xl p-5 border border-slate-100 shadow-sm">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="text-base">📢</span>
                        <h2 class="text-sm font-bold text-slate-900 uppercase tracking-wider">
                            Pengumuman / Reminder
                        </h2>
                    </div>
                    <textarea
                        id="message"
                        rows="3"
                        placeholder="Tulis informasi atau pengumuman kas..."
                        class="w-full bg-slate-50 border border-slate-200 focus:border-purple-500 focus:bg-white focus:ring-2 focus:ring-purple-200 outline-none p-3 text-xs sm:text-sm rounded-2xl mb-3 transition resize-none"></textarea>
                    <button
                        onclick="saveMessage()"
                        class="w-full bg-purple-600 hover:bg-purple-700 active:scale-95 text-white text-xs font-bold py-3 rounded-xl shadow-sm transition">
                        Update Informasi
                    </button>
                </div>

                <!-- Form Pemasukan -->
                <div class="bg-white rounded-3xl p-5 border border-emerald-100 shadow-sm">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="w-6 h-6 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-xs">➕</span>
                        <h2 class="text-sm font-bold text-slate-900 uppercase tracking-wider">
                            Catat Pemasukan
                        </h2>
                    </div>

                    <div class="space-y-2.5">
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-500 mb-1">Nama Wali / Siswa</label>
                            <input
                                id="nama"
                                type="text"
                                placeholder="Contoh: Bpk. Ahmad (Fulan)"
                                class="w-full bg-slate-50 border border-slate-200 focus:border-emerald-500 focus:bg-white focus:ring-2 focus:ring-emerald-200 outline-none p-2.5 text-xs rounded-xl transition">
                        </div>

                        <div>
                            <label class="block text-[11px] font-semibold text-slate-500 mb-1">Nominal (Rp)</label>
                            <input
                                id="nominalMasuk"
                                type="number"
                                placeholder="Contoh: 50000"
                                class="w-full bg-slate-50 border border-slate-200 focus:border-emerald-500 focus:bg-white focus:ring-2 focus:ring-emerald-200 outline-none p-2.5 text-xs rounded-xl transition font-mono">
                        </div>

                        <div>
                            <label class="block text-[11px] font-semibold text-slate-500 mb-1">Keterangan</label>
                            <input
                                id="ketMasuk"
                                type="text"
                                placeholder="Contoh: Kas Bulan November"
                                class="w-full bg-slate-50 border border-slate-200 focus:border-emerald-500 focus:bg-white focus:ring-2 focus:ring-emerald-200 outline-none p-2.5 text-xs rounded-xl mb-3 transition">
                        </div>

                        <button
                            onclick="tambahMasuk()"
                            class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white text-xs font-bold py-3 rounded-xl shadow-sm transition">
                            Simpan Pemasukan
                        </button>
                    </div>
                </div>

                <!-- Form Pengeluaran -->
                <div class="bg-white rounded-3xl p-5 border border-rose-100 shadow-sm">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="w-6 h-6 rounded-lg bg-rose-100 text-rose-700 flex items-center justify-center font-bold text-xs">➖</span>
                        <h2 class="text-sm font-bold text-slate-900 uppercase tracking-wider">
                            Catat Pengeluaran
                        </h2>
                    </div>

                    <div class="space-y-2.5">
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-500 mb-1">Keperluan</label>
                            <input
                                id="keperluan"
                                type="text"
                                placeholder="Contoh: Pembelian Spidol & Penghapus"
                                class="w-full bg-slate-50 border border-slate-200 focus:border-rose-500 focus:bg-white focus:ring-2 focus:ring-rose-200 outline-none p-2.5 text-xs rounded-xl transition">
                        </div>

                        <div>
                            <label class="block text-[11px] font-semibold text-slate-500 mb-1">Nominal (Rp)</label>
                            <input
                                id="nominalKeluar"
                                type="number"
                                placeholder="Contoh: 25000"
                                class="w-full bg-slate-50 border border-slate-200 focus:border-rose-500 focus:bg-white focus:ring-2 focus:ring-rose-200 outline-none p-2.5 text-xs rounded-xl mb-3 transition font-mono">
                        </div>

                        <button
                            onclick="tambahKeluar()"
                            class="w-full bg-rose-600 hover:bg-rose-700 active:scale-95 text-white text-xs font-bold py-3 rounded-xl shadow-sm transition">
                            Simpan Pengeluaran
                        </button>
                    </div>
                </div>

            </div>

        </main>

        <!-- ================= STICKY BOTTOM NAVIGATION ================= -->
        <nav class="fixed sm:absolute bottom-0 left-0 right-0 max-w-full sm:max-w-[430px] mx-auto bg-white/90 backdrop-blur-lg border-t border-slate-200/80 px-6 py-2.5 z-50 flex items-center justify-around sm:rounded-b-[30px]">
            <!-- Beranda -->
            <a href="index.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-700 transition-all">
                <span class="text-lg">🏠</span>
                <span class="text-[10px] font-semibold">Beranda</span>
            </a>

            <!-- Laporan -->
            <a href="laporan.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-700 transition-all">
                <span class="text-lg">📄</span>
                <span class="text-[10px] font-semibold">Laporan</span>
            </a>

            <!-- Admin (Active) -->
            <a href="admin.html" class="flex flex-col items-center gap-1 text-purple-600 transition-all">
                <span class="text-lg">🔒</span>
                <span class="text-[10px] font-bold">Admin</span>
            </a>
        </nav>

    </div>

    <!-- Script Technical Logic (Untouched & 100% Intact) -->
    <script>
    const API="https://script.google.com/macros/s/AKfycbwxFyfYQXmeM1_bOWGZkHKqwLLUv57qZdGEpetG85MzdI9C43rN_vwpm_POxqQH5YiOHQ/exec";
    let PIN="";
    const rupiah=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n);
    async function login(){PIN=pin.value;const r=await fetch(API,{method:"POST",body:JSON.stringify({action:"login",pin:PIN})});const d=await r.json();if(!d.success){msg.innerText="PIN salah";return;}loginCard.classList.add("hidden");app.classList.remove("hidden");loadSaldo();}
    async function loadSaldo(){const d=await (await fetch(API)).json();saldo.innerText=rupiah(d.saldo);message.value=d.message||"";if(d.adminWa){waBtn.href=`https://wa.me/${d.adminWa}`;waBtn.classList.remove("hidden");}}
    async function send(body){const d=await (await fetch(API,{method:"POST",body:JSON.stringify(body)})).json();alert(d.message||(d.success?"Berhasil":"Gagal"));if(d.success)loadSaldo();}
    function tambahMasuk(){send({action:"tambahMasuk",pin:PIN,tanggal:new Date().toISOString().slice(0,10),nama:nama.value,nominal:nominalMasuk.value,keterangan:ketMasuk.value});}
    function tambahKeluar(){send({action:"tambahKeluar",pin:PIN,tanggal:new Date().toISOString().slice(0,10),nominal:nominalKeluar.value,keperluan:keperluan.value});}
    function saveMessage(){send({action:"saveMessage",pin:PIN,message:message.value});}
    </script>
</body>
</html>
